services:
  bot:
    build: .
    container_name: sfm-bot
    restart: unless-stopped
    volumes:
      - ./data:/usr/src/app/data
      - ./config.json:/usr/src/app/config.json:ro
    environment:
      - TZ=Europe/Rome
      - PYTHONPATH=/usr/src/app
      - PYTHONUNBUFFERED=1
    networks:
      - sfm-net

networks:
  sfm-net:
    driver: bridge
