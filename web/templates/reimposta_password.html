{% extends "base.html" %}
{% block title %}Nuova password — {{ app_name }}{% endblock %}
{% block robots %}<meta name="robots" content="noindex, nofollow">{% endblock %}
{% block content %}
<div class="auth">
<h1>Scegli una nuova password</h1>
<form method="post" class="card" novalidate>
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <label for="new">Nuova password <small>(almeno 10 caratteri)</small></label>
  <input id="new" name="new" type="password" autocomplete="new-password" minlength="10" required>
  <button type="submit" class="button primary">Salva e accedi</button>
</form>
</div>
{% endblock %}
