{% extends "base.html" %}
{% block title %}Password dimenticata — {{ app_name }}{% endblock %}
{% block robots %}<meta name="robots" content="noindex, nofollow">{% endblock %}
{% block content %}
<div class="auth">
<h1>Password dimenticata</h1>
<form method="post" class="card" novalidate>
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <p class="muted">Inserisci l'email del tuo account: ti mandiamo un link per scegliere una nuova password.</p>
  <label for="email">Email</label>
  <input id="email" name="email" type="email" autocomplete="email" required>
  <button type="submit" class="button primary">Inviami il link</button>
  <p class="muted"><a href="{{ url_for('auth.login') }}">Torna all'accesso</a></p>
</form>
</div>
{% endblock %}
